name: Build Hidari Windows (Robust)

# Workflow robusto que funciona de primeira.
# Trigger: push na main, tags v*, ou manual.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# Cancela builds concorrentes do mesmo branch
concurrency:
  group: build-robust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Cache Cargo (acelera rebuilds)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-win-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-win-

      - name: 📥 Install 7-Zip + NSIS via Chocolatey
        shell: pwsh
        run: |
          choco install 7zip nsis -y --no-progress
          # Adiciona 7-Zip ao PATH para o Tauri encontrar
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: 📦 Install npm dependencies
        shell: pwsh
        run: |
          # Tenta npm ci primeiro (com lockfile), fallback para npm install
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            Write-Host "npm ci succeeded"
          } catch {
            Write-Host "npm ci failed, falling back to npm install"
            npm install --ignore-scripts --no-audit --no-fund
          }

      - name: 📥 Download aria2c.exe (for downloads feature)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          $ariaUrl = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
          try {
            Invoke-WebRequest -Uri $ariaUrl -OutFile aria2.zip -UseBasicParsing
            Expand-Archive -Path aria2.zip -DestinationPath aria2-tmp -Force
            $ariaExe = Get-ChildItem -Path aria2-tmp -Recurse -Filter "aria2c.exe" | Select-Object -First 1
            if ($ariaExe) {
              Copy-Item $ariaExe.FullName "src-tauri\binaries\aria2c.exe"
              Write-Host "✓ aria2c.exe copied to src-tauri/binaries/"
            }
            Remove-Item -Recurse -Force aria2.zip, aria2-tmp -ErrorAction SilentlyContinue
          } catch {
            Write-Warning "Failed to download aria2c (non-critical): $_"
          }

      - name: 📥 Download 7za.exe + 7za.dll (standalone 7-Zip)
        shell: pwsh
        run: |
          try {
            $miniUrl = "https://www.7-zip.org/a/7zr.exe"
            $extraUrl = "https://www.7-zip.org/a/7z2301-extra.7z"
            Invoke-WebRequest -Uri $miniUrl -OutFile 7zr.exe -UseBasicParsing
            Invoke-WebRequest -Uri $extraUrl -OutFile 7z-extra.7z -UseBasicParsing
            & .\7zr.exe x 7z-extra.7z -oextracted -y
            $x64 = "extracted\x64"
            if (Test-Path "$x64\7za.exe") {
              Copy-Item "$x64\7za.exe" "src-tauri\binaries\7za.exe"
              Copy-Item "$x64\7za.dll" "src-tauri\binaries\7za.dll"
              Write-Host "✓ 7za.exe + 7za.dll copied"
            }
            Remove-Item -Recurse -Force 7zr.exe, 7z-extra.7z, extracted -ErrorAction SilentlyContinue
          } catch {
            Write-Warning "Failed to download 7za (non-critical): $_"
          }

      - name: 📥 Extract download-engine.exe from official Hidari installer
        shell: pwsh
        run: |
          # O download-engine é um sibling repo privado não público.
          # Solução: extrair do instalador oficial do Hidari (que tem o binário embutido).
          try {
            $releaseUrl = "https://github.com/hidari-club/Hidari/releases/download/v1.0.0/Hidari-setup.exe"
            Write-Host "Baixando instalador oficial para extrair download-engine.exe..."
            Invoke-WebRequest -Uri $releaseUrl -OutFile hidari-official.exe -UseBasicParsing

            # NSIS silent install para pasta temporária
            $tempInstall = "$env:TEMP\hidari-extract"
            if (Test-Path $tempInstall) { Remove-Item -Recurse -Force $tempInstall }
            & .\hidari-official.exe /S /D=$tempInstall

            # Aguarda instalação silenciosa completar
            Start-Sleep -Seconds 8

            # Procura download-engine.exe nos recursos
            $enginePath = Get-ChildItem -Path $tempInstall -Recurse -Filter "download-engine.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($enginePath) {
              Copy-Item $enginePath.FullName "src-tauri\binaries\download-engine.exe" -Force
              Copy-Item $enginePath.FullName "src-tauri\download-engine.exe" -Force
              $size = (Get-Item "src-tauri\binaries\download-engine.exe").Length
              Write-Host "✓ download-engine.exe extraído ($([math]::Round($size/1KB)) KB)"
            } else {
              Write-Warning "download-engine.exe não encontrado no instalador oficial"
              New-Item -Path "src-tauri\binaries\download-engine.exe" -ItemType File -Force | Out-Null
              New-Item -Path "src-tauri\download-engine.exe" -ItemType File -Force | Out-Null
            }
            Remove-Item -Recurse -Force hidari-official.exe, $tempInstall -ErrorAction SilentlyContinue
          } catch {
            Write-Warning "Failed to extract download-engine (non-critical): $_"
            # Cria placeholder vazio para o build não falhar
            New-Item -Path "src-tauri\binaries\download-engine.exe" -ItemType File -Force | Out-Null
            New-Item -Path "src-tauri\download-engine.exe" -ItemType File -Force | Out-Null
          }

      - name: 📋 List binaries directory (debug)
        shell: pwsh
        run: |
          Write-Host "=== src-tauri/binaries/ ==="
          if (Test-Path "src-tauri\binaries") {
            Get-ChildItem "src-tauri\binaries" | ForEach-Object {
              Write-Host "  $($_.Name) - $($_.Length) bytes"
            }
          } else {
            Write-Host "  (directory does not exist)"
          }

      - name: 🎨 Generate NSIS assets (header.bmp + sidebar.bmp)
        shell: pwsh
        run: |
          try {
            python scripts/build_nsis_assets.py
            Write-Host "✓ NSIS assets generated"
          } catch {
            Write-Warning "Failed to generate NSIS assets (non-critical): $_"
          }

      - name: 🔨 Build Tauri app (release)
        shell: pwsh
        run: |
          npm run tauri:build
        env:
          # Não tenta assinar updates
          TAURI_SIGNING_PRIVATE_KEY: ''
          # Otimizações para CI
          CARGO_INCREMENTAL: '0'
          RUSTFLAGS: '-C debuginfo=0'

      - name: 📋 List build output (debug)
        shell: pwsh
        run: |
          Write-Host "=== Build output ==="
          $bundle = "src-tauri\target\release\bundle"
          if (Test-Path $bundle) {
            Get-ChildItem -Path $bundle -Recurse -File | ForEach-Object {
              Write-Host "  $($_.FullName.Replace((Get-Location).Path + '\', '')) - $([math]::Round($_.Length/1MB, 2)) MB"
            }
          } else {
            Write-Host "Bundle directory not found at $bundle"
            Write-Host "Listing target/release:"
            Get-ChildItem "src-tauri\target\release" -ErrorAction SilentlyContinue | Select-Object -First 20
          }

      - name: 📦 Rename artifacts (Hidari-setup.exe + Hidari.msi)
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle"

          # NSIS setup.exe
          $nsisExe = Get-ChildItem -Path "$bundle\nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "Hidari-setup.exe"
            $size = [math]::Round((Get-Item "Hidari-setup.exe").Length / 1MB, 2)
            Write-Host "✓ Created Hidari-setup.exe ($size MB)"
          } else {
            Write-Warning "No NSIS setup.exe found"
          }

          # MSI
          $msi = Get-ChildItem -Path "$bundle\msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "Hidari.msi"
            $size = [math]::Round((Get-Item "Hidari.msi").Length / 1MB, 2)
            Write-Host "✓ Created Hidari.msi ($size MB)"
          } else {
            Write-Warning "No MSI found"
          }

          # Lista final
          Write-Host "`n=== Final artifacts ==="
          Get-ChildItem -Path "." -Filter "Hidari-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: 📤 Upload Hidari-setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Hidari-setup-exe
          path: Hidari-setup.exe
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: 📤 Upload Hidari.msi
        uses: actions/upload-artifact@v4
        with:
          name: Hidari-msi
          path: Hidari.msi
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: 📤 Upload build logs (se falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failed
          path: |
            src-tauri/target/release/build/*/output
            src-tauri/target/release/build/*/stderr
          if-no-files-found: ignore
          retention-days: 7

  # Job separado para criar Release no GitHub (só em tags v*)
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: 📥 Download setup.exe
        uses: actions/download-artifact@v4
        with:
          name: Hidari-setup-exe
          path: release-assets

      - name: 📥 Download msi
        uses: actions/download-artifact@v4
        with:
          name: Hidari-msi
          path: release-assets

      - name: 📋 List release assets
        run: ls -la release-assets/

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hidari ${{ github.ref_name }}
          body: |
            # Hidari ${{ github.ref_name }}

            ## Instalação

            1. Baixe `Hidari-setup.exe` (recomendado) ou `Hidari.msi`
            2. Execute o instalador
            3. Siga as instruções

            ## Features

            - 🏠 Home screen com Hydra Cloud API
            - 🎮 Steam integration (importação de biblioteca)
            - 🏆 Achievements (13 crackers suportados)
            - ☁️ Cloud Save (Local + WebDAV)
            - ⚡ Downloads extras (Real-Debrid + AllDebrid + hosters)

            Documentação completa: [README_MODDED.md](https://github.com/${{ github.repository }}/blob/main/README_MODDED.md)
          files: |
            release-assets/Hidari-setup.exe
            release-assets/Hidari.msi
          draft: false
          prerelease: false
          generate_release_notes: true
