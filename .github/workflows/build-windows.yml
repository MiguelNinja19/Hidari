name: Build Hidari (Windows)

# Trigger: push na main, tags v*, ou manual via Actions tab
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      debug:
        description: 'Build com logs detalhados'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

# Evita builds concorrentes do mesmo branch
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Setup Python (para scripts NSIS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-windows-

      - name: 📥 Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: 📦 Install npm dependencies
        run: npm ci
        env:
          # Pula o postinstall (setup:binaries) que tenta baixar coisas que podem falhar
          npm_config_ignore_scripts: 'true'

      - name: 🔍 Verify 7-Zip installation (via choco)
        run: |
          choco install 7zip -y --no-progress
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: 📥 Download aria2c
        run: |
          mkdir -p src-tauri/binaries
          $ariaUrl = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
          Invoke-WebRequest -Uri $ariaUrl -OutFile aria2.zip
          Expand-Archive -Path aria2.zip -DestinationPath aria2-tmp -Force
          Copy-Item "aria2-tmp/aria2-1.37.0-win-64bit-build1/aria2c.exe" "src-tauri/binaries/aria2c.exe"
          Remove-Item -Recurse -Force aria2.zip, aria2-tmp
          Write-Host "aria2c.exe installed"

      - name: 📥 Download 7za.exe + 7za.dll
        run: |
          # Baixa o 7-Zip extra (contém 7za.exe standalone)
          $sevenZipUrl = "https://www.7-zip.org/a/7z2301-extra.7z"
          $sevenZipMiniUrl = "https://www.7-zip.org/a/7zr.exe"

          Invoke-WebRequest -Uri $sevenZipMiniUrl -OutFile 7zr.exe
          Invoke-WebRequest -Uri $sevenZipUrl -OutFile 7z-extra.7z

          # Extrai usando o 7zr.exe mini
          & .\7zr.exe x 7z-extra.7z -oextracted -y
          Copy-Item "extracted\x64\7za.exe" "src-tauri\binaries\7za.exe"
          Copy-Item "extracted\x64\7za.dll" "src-tauri\binaries\7za.dll"

          Remove-Item -Recurse -Force 7zr.exe, 7z-extra.7z, extracted
          Write-Host "7za.exe + 7za.dll installed"

      - name: 📥 Download download-engine.exe (do release oficial do Hidari)
        run: |
          # O download-engine é um sibling repo separado não público.
          # Solução: extrair do instalador oficial do Hidari (que tem o binário embutido).
          $releaseUrl = "https://github.com/hidari-club/Hidari/releases/download/v1.0.0/Hidari-setup.exe"
          Write-Host "Baixando instalador oficial do Hidari para extrair download-engine.exe..."
          Invoke-WebRequest -Uri $releaseUrl -OutFile hidari-official.exe

          # Instala silenciosamente em pasta temporária para extrair o binário
          # NSIS installer aceita /S para silent install e /D= para diretório
          $tempInstall = "$env:TEMP\hidari-extract"
          & .\hidari-official.exe /S /D=$tempInstall

          # Aguarda instalação completar
          Start-Sleep -Seconds 5

          # Procura o download-engine.exe nos recursos instalados
          $enginePath = Get-ChildItem -Path $tempInstall -Recurse -Filter "download-engine.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($enginePath) {
            Copy-Item $enginePath.FullName "src-tauri\binaries\download-engine.exe"
            Copy-Item $enginePath.FullName "src-tauri\download-engine.exe"
            Write-Host "download-engine.exe extraído com sucesso"
          } else {
            Write-Warning "download-engine.exe não encontrado no instalador oficial. Downloads não funcionarão, mas o resto do app sim."
            # Cria um placeholder vazio para o build não falhar
            New-Item -Path "src-tauri\binaries\download-engine.exe" -ItemType File -Force | Out-Null
            New-Item -Path "src-tauri\download-engine.exe" -ItemType File -Force | Out-Null
          }

          # Limpa
          Remove-Item -Recurse -Force hidari-official.exe, $tempInstall -ErrorAction SilentlyContinue

      - name: 🎨 Generate NSIS assets (header.bmp + sidebar.bmp)
        run: |
          try {
            python scripts/build_nsis_assets.py
            Write-Host "NSIS assets gerados"
          } catch {
            Write-Warning "Falha ao gerar NSIS assets (não crítico): $_"
          }
        shell: pwsh

      - name: 🔨 Build Tauri app
        run: npm run tauri:build
        env:
          # Evita warning de signing key
          TAURI_SIGNING_PRIVATE_KEY: ''
          # CI optimizations
          CARGO_INCREMENTAL: '0'
          RUSTFLAGS: '-C debuginfo=0'

      - name: 📋 List build output
        run: |
          Write-Host "=== Build output ==="
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -File | ForEach-Object {
            Write-Host "$($_.FullName) - $($_.Length / 1KB) KB"
          }
        shell: pwsh

      - name: 📦 Rename artifacts (Hidari-setup.exe + Hidari.msi)
        run: |
          $bundleDir = "src-tauri\target\release\bundle"

          # NSIS setup.exe
          $nsisExe = Get-ChildItem -Path "$bundleDir\nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "Hidari-setup.exe"
            Write-Host "Created Hidari-setup.exe"
          }

          # MSI
          $msi = Get-ChildItem -Path "$bundleDir\msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "Hidari.msi"
            Write-Host "Created Hidari.msi"
          }

          # Lista final
          Get-ChildItem -Path "." -Filter "Hidari-*" | ForEach-Object {
            Write-Host "$($_.Name) - $($_.Length / 1MB) MB"
          }
        shell: pwsh

      - name: 📤 Upload Hidari-setup.exe (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Hidari-setup-exe
          path: Hidari-setup.exe
          if-no-files-found: warn
          retention-days: 30

      - name: 📤 Upload Hidari.msi (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Hidari-msi
          path: Hidari.msi
          if-no-files-found: warn
          retention-days: 30

      - name: 📤 Upload build logs (se falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failed
          path: |
            src-tauri/target/release/build/*/output
            npm-debug.log
          if-no-files-found: ignore
          retention-days: 7

  # Job separado para criar Release no GitHub (só em tags v*)
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: 📥 Download setup.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: Hidari-setup-exe
          path: release-assets

      - name: 📥 Download msi artifact
        uses: actions/download-artifact@v4
        with:
          name: Hidari-msi
          path: release-assets

      - name: 📋 List release assets
        run: ls -la release-assets/

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hidari ${{ github.ref_name }}
          body: |
            # Hidari ${{ github.ref_name }}

            ## Instalação

            1. Baixe o `Hidari-setup.exe` (recomendado) ou `Hidari.msi`
            2. Execute o instalador
            3. Siga as instruções na tela

            ## Features

            - 🏠 Home screen com Hydra Cloud API
            - 🎮 Steam integration (importação de biblioteca)
            - 🏆 Achievements (13 crackers suportados)
            - ☁️ Cloud Save (Local + WebDAV)
            - ⚡ Downloads extras (Real-Debrid + AllDebrid + hosters)

            Veja o [README_MODDED.md](https://github.com/${{ github.repository }}/blob/main/README_MODDED.md) para documentação completa.

            ## Checksums

            ```text
            ${{ hashFiles('release-assets/Hidari-setup.exe') }}
            ${{ hashFiles('release-assets/Hidari.msi') }}
            ```
          files: |
            release-assets/Hidari-setup.exe
            release-assets/Hidari.msi
          draft: false
          prerelease: false
          generate_release_notes: true
