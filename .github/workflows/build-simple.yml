name: Build Hidari (Simple)

# Workflow SIMPLIFICADO: apenas compila o Tauri app
# Não tenta resolver o download-engine (que é um repo privado separado)
# Use este se o workflow principal falhar

on:
  workflow_dispatch:
    inputs:
      skip_engine:
        description: 'Pular download-engine (downloads não funcionarão)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 📦 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 💾 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-

      - name: 📥 Install 7-Zip + NSIS
        run: choco install 7zip nsis -y --no-progress

      - name: 📦 npm install
        run: npm ci --ignore-scripts

      - name: 📥 Setup binaries (aria2c, 7za)
        run: node scripts/setup-binaries.mjs
        continue-on-error: true

      - name: 📥 Ensure download-engine.exe placeholder
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/binaries/download-engine.exe")) {
            New-Item -Path "src-tauri/binaries/download-engine.exe" -ItemType File -Force | Out-Null
            Write-Warning "download-engine.exe é placeholder vazio. Downloads não funcionarão."
          }
          if (-not (Test-Path "src-tauri/download-engine.exe")) {
            Copy-Item "src-tauri/binaries/download-engine.exe" "src-tauri/download-engine.exe"
          }

      - name: 🔨 Build
        run: npm run tauri:build
        env:
          CARGO_INCREMENTAL: '0'
          RUSTFLAGS: '-C debuginfo=0'

      - name: 📦 Rename + collect artifacts
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle"
          $nsis = Get-ChildItem "$bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "Hidari-setup.exe" }
          $msi = Get-ChildItem "$bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "Hidari.msi" }
          Get-ChildItem "Hidari-*" | ForEach-Object { Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB" }

      - name: 📤 Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Hidari-setup
          path: Hidari-setup.exe
          if-no-files-found: warn

      - name: 📤 Upload msi
        uses: actions/upload-artifact@v4
        with:
          name: Hidari-msi
          path: Hidari.msi
          if-no-files-found: warn
