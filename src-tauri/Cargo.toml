[package]
name = "app"
version = "0.1.0"
description = "Hidari — launcher desktop Tauri"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
url = "2.5.7"
tokio = { version = "1.48.0", features = ["time", "process", "io-util"] }
notify = "8.0.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
dotenvy = "0.15"
regex = "1"
sysinfo = "0.33"
open = "5"
